## الفوائد الجسدية للرياضة

ممارسة الرياضة بانتظام تساعد الأطفال على:
- تقوية العضلات والعظام
- تحسين التوازن والتنسيق الحركي
- تعزيز جهاز المناعة
- الحفاظ على وزن صحي

## الفوائد النفسية

- بناء الثقة بالنفس
- تطوير القدرة على التحمل والمثابرة
- إدارة التوتر والقلق بشكل أفضل
- تعزيز روح التنافس الشريف

## الفوائد الاجتماعية

## العوامل الأساسية في الاختيار

### العمر
كل مرحلة عمرية لها رياضاتها المناسبة:
- ٣-٥ سنوات: الجمباز والسكيتنج
- ٥-٨ سنوات: السباحة والكاراتيه
- ٨-١٢ سنوات: كرة القدم وكرة السلة
- ١٢+ سنة: جميع الرياضات

### الميول الشخصية

- هل يحب الأنشطة الجماعية أم الفردية؟
- هل يستمتع بالمنافسة أم التعاون؟
- ما الأنشطة التي يمارسها بشكل تلقائي؟

### القدرات البدنية

## الإنجازات المحققة

### كرة القدم
فاز فريق الأكاديمية في الفئة العمرية (١٢-١٤ سنة) بالميدالية الذهبية بعد مباراة نهائية مثيرة.

### الكاراتيه
حصد المتسابقون من أكاديمية القمة ٣ ميداليات ذهبية، ميداليتين فضيتين، وميداليتين برونزيتين.

### السباحة
سجّل سباحو الأكاديمية أرقامًا قياسية جديدة في فئات عدة.

## كلمة المدير التنفيذي

قال مدير الأكاديمية: "نحن فخورون بهذه الإنجازات التي تعكس مستوى التدريب العالي ومجهودات مدربينا المتميزين وإصرار طلابنا على التفوق."`,category:"أخبار وإنجازات",author:"فريق التحرير",date:"١٠ يناير ٢٠٢٥",readTime:"٤ دقائق",image:"/images/basketball.jpg",tags:["بطولة","إنجازات","جدة","أخبار"]},{id:"4",title:"التغذية الرياضية للناشئين: ما يجب أن يعرفه كل أهل",excerpt:"التغذية السليمة هي الركيزة الثانية للأداء الرياضي المتميز، ففي هذا المقال نستعرض أهم المبادئ الغذائية التي يحتاجها الرياضيون الناشئون لتحقيق أفضل أداء.",content:`التغذية السليمة هي الركيزة الثانية للأداء الرياضي المتميز. في أكاديمية القمة، نؤمن بأن التدريب الجيد يبدأ من الطاولة قبل الملعب.

## أهمية التغذية للرياضيين الناشئين

الأطفال والمراهقون الذين يمارسون الرياضة يحتاجون إلى:
- سعرات حرارية أعلى مما يحتاجه أقرانهم
- بروتين كافٍ لبناء العضلات
- كربوهيدرات معقدة للطاقة المستدامة
- ترطيب كافٍ قبل وأثناء وبعد التمرين

## الوجبات المثالية للرياضيين

### قبل التمرين (١-٢ ساعة)
- وجبة غنية بالكربوهيدرات المعقدة
- بروتين معتدل
- كميات قليلة من الدهون

### بعد التمرين (خلال ٣٠ دقيقة)
- بروتين سريع الامتصاص
- كربوهيدرات بسيطة لإعادة الطاقة
- سوائل وافرة`,category:"صحة وتغذية",author:"خبير التغذية الرياضية",date:"٥ يناير ٢٠٢٥",readTime:"٧ دقائق",image:"/images/swimming.jpg",tags:["تغذية","صحة","رياضيون","ناشئون"]},{id:"5",title:"السباحة: الرياضة الكاملة لنمو طفلك",excerpt:"تُعدّ السباحة من أفضل الرياضات للأطفال نظرًا لفوائدها المتعددة على الجسم والعقل، وفي هذا المقال نستكشف سبب تميزها عن سائر الرياضات وكيف تستفيد منها أقصى استفادة.",content:`تُعدّ السباحة من أفضل الرياضات للأطفال نظرًا لفوائدها المتعددة على الجسم والعقل.

## لماذا السباحة؟

السباحة رياضة فريدة لأنها:
- تُحرّك جميع عضلات الجسم
- لا تُشكّل ضغطًا على المفاصل
- تُحسّن القدرة على التنفس
- تُعزّز ثقة الطفل بنفسه

## المراحل التعليمية في أكاديمية القمة

### مرحلة الألفة مع الماء (٣-٥ سنوات)
تعلم الطفل الاسترخاء في الماء وإزالة الخوف.

### مرحلة الأساسيات (٥-٨ سنوات)
تعلم أنماط السباحة الأساسية والأمان المائي.

### مرحلة التطوير (٨-١٢ سنوات)
إتقان جميع الأنماط وتحسين التقنية والسرعة.

### مرحلة التنافس (+١٢ سنة)

## قيم الكاراتيه

### الانضباط الذاتي
الكاراتيه يعلم الالتزام بالقواعد واحترام الوقت.

### الاحترام
أساس أي دوجو (قاعة تدريب) هو الاحترام المتبادل.

### المثابرة
طريق الحزام الأسود طويل ويتطلب صبرًا وإصرارًا.

## نظام الأحزمة في أكاديمية القمة

نتبع النظام الياباني الأصيل:
1. الحزام الأبيض - المبتدئ
2. الحزام الأصفر - المستجد
3. الحزام البرتقالي - المتوسط الأدنى
4. الحزام الأخضر - المتوسط
5. الحزام الأزرق - المتوسط الأعلى
6. الحزام البني - المتقدم
7. الحزام الأسود - الخبير`,category:"رياضات",author:"أ. طارق البلوي",date:"٢٥ ديسمبر ٢٠٢٤",readTime:"٦ دقائق",image:"/images/karate.jpg",tags:["كاراتيه","انضباط","شخصية","أطفال"]}],qo=[{id:"1",title:"The Role of Sports in Shaping Your Child’s Personality",excerpt:"Sports play a foundational role in building your child’s personality, physical agility, mental resilience, and social skills. Starting early instills lifelong confidence and discipline.",content:`Sports play a fundamental role in shaping your child’s character, physical capability, and social well-being. Children who engage in sports from an early age acquire invaluable life skills that stay with them forever.

## Physical Benefits of Regular Training

Consistent athletic exercise helps children:
- Strengthen core muscles and bone density
- Enhance balance and neuromuscular coordination
- Boost immune system and cardiovascular endurance
- Maintain a healthy weight and energized lifestyle

## Psychological & Emotional Growth

Sports are not merely physical exercise; they are a classroom for mental fortitude. They help:
- Build self-confidence and emotional resilience
- Foster perseverance, grit, and patience
- Manage everyday stress and anxiety constructively
- Cultivate a healthy respect for fair play and sportsmanship

## Social and Teamwork Skills

Group sports and team dynamics teach children:
- Effective collaboration within a team
- Respecting coaches and teammates, handling both victory and defeat gracefully
- Leadership, active listening, and empathy
- Forming authentic, lasting friendships`,category:"Health & Development",author:"Coach Mohammed Al-Asiri",date:"Jan 20, 2025",readTime:"5 min read",image:"/images/about-team.jpg",tags:["Sports","Children","Health","Development"]},{id:"2",title:"How to Choose the Right Sport for Your Child",excerpt:"Selecting the right sport for your child involves considering age, physical build, and personal interests. Here is a practical guide to help parents make the best decision.",content:`Choosing the right sport for your child is a key milestone. At ALQIMA Academy, we guide parents in identifying their child’s unique inclinations and selecting the most beneficial program.

## Key Factors in Choosing

### Age Appropriateness
Every developmental stage has natural athletic matches:
- 3–5 Years: Gymnastics & Skating (balance and spatial awareness)
- 5–8 Years: Swimming & Karate (discipline, safety, and foundational agility)
- 8–12 Years: Football & Basketball (team tactics and ball mastery)
- 12+ Years: Specialized competitive pathways across all sports

### Personal Inclinations
Observe your child closely:
- Do they thrive in group team dynamics or individual focus?
- Do they enjoy high-speed motion or structured rhythmic technique?
- What physical activities do they naturally gravitate toward during playtime?

### Physical Aptitude & Goals
Every child has unique strengths. Our coaches conduct friendly initial assessments to help you match your child’s goals with the optimal training track.`,category:"Parenting Tips",author:"Coach Saad Al-Otaibi",date:"Jan 15, 2025",readTime:"6 min read",image:"/images/football.jpg",tags:["Parents","Guidance","Selection","Youth Sports"]},{id:"3",title:"ALQIMA Champions Clinch Gold at Jeddah Youth Championship",excerpt:"ALQIMA Sports Academy athletes achieved outstanding victories at the annual Jeddah Youth Championship, earning top podium finishes in Football, Karate, and Swimming.",content:`Students of ALQIMA Sports Academy delivered stellar performances at the Jeddah Youth Championship 2025.

## Championship Highlights

### Football Team
The U-14 academy team captured the Gold Medal after a thrilling final match demonstrating remarkable tactical composure.

### Karate Team
ALQIMA martial arts competitors secured 3 Gold, 2 Silver, and 2 Bronze medals across youth kata and kumite categories.

### Swimming Squad
Our junior swimmers registered new personal bests in freestyle and backstroke events.

## Executive Director’s Statement

"We are immensely proud of our young champions. These achievements mirror the high coaching standards of our staff and the wonderful dedication of the parents who support their children every step of the way."`,category:"News & Achievements",author:"Editorial Team",date:"Jan 10, 2025",readTime:"4 min read",image:"/images/basketball.jpg",tags:["Championship","Achievements","Jeddah","News"]},{id:"4",title:"Youth Sports Nutrition: A Practical Guide for Parents",excerpt:"Proper nutrition is the cornerstone of athletic development and stamina. Discover key nutritional principles every parent should know to fuel their young athlete.",content:`Proper nutrition is the cornerstone of peak athletic performance. At ALQIMA Academy, we believe great training begins at the family dining table.

## Why Young Athletes Need Specialized Nutrition

Active children and teens require:
- Higher wholesome caloric intake to support growth and exercise
- Adequate high-quality protein for muscle recovery
- Complex carbohydrates for sustained energy throughout training
- Consistent hydration before, during, and following workouts

## Ideal Meal Timing for Young Champions

### Pre-Training (1–2 Hours Prior)
- Complex carbs (oats, whole grains, bananas)
- Light protein source
- Low fats to ensure smooth digestion

### Post-Training (Within 30–45 Minutes)
- Fast-absorbing protein and simple carbs for energy replenishment
- Ample water and electrolyte-rich fluids`,category:"Health & Nutrition",author:"Sports Nutrition Consultant",date:"Jan 5, 2025",readTime:"7 min read",image:"/images/swimming.jpg",tags:["Nutrition","Health","Athletes","Youth"]},{id:"5",title:"Swimming: The Complete Sport for Your Child’s Development",excerpt:"Swimming is widely regarded as one of the most comprehensive sports for children, strengthening every muscle group while building endurance and safety confidence.",content:`Swimming is one of the most complete, low-impact sports for children, delivering balanced physical and cognitive benefits.

## Why Swimming?

Swimming is unique because it:
- Engages all major muscle groups harmoniously
- Places zero stress on developing joints
- Significantly improves lung capacity and breath control
- Enhances self-reliance and vital water safety skills

## Learning Stages at ALQIMA Academy

### Water Familiarity (Ages 3–5)
Building comfort, breathing control, and removing fear of water.

### Fundamentals (Ages 5–8)
Mastering basic propulsion, floating, and water safety techniques.

### Technique Refinement (Ages 8–12)
Perfecting the four competitive strokes (Freestyle, Backstroke, Breaststroke, Butterfly) with proper timing.

### Competitive Squad (Ages 12+)
Endurance conditioning and preparation for regional youth swim meets.`,category:"Sports",author:"Coach Youssef Al-Harbi",date:"Jan 1, 2025",readTime:"5 min read",image:"/images/swimming.jpg",tags:["Swimming","Children","Development","Fitness"]},{id:"6",title:"Karate & Discipline: How Martial Arts Shape Character",excerpt:"Beyond self-defense, Karate provides a structured pathway for developing self-discipline, focus, mutual respect, and determination in young boys and girls.",content:`Karate is far more than self-defense; it is a holistic curriculum for personal growth and character building.

## Core Values of Karate

### Self-Discipline
Karate teaches children punctuality, focus, following rules, and controlling impulses.

### Mutual Respect
The hallmark of every dojo is deep respect for coaches, peers, and oneself.

### Perseverance
Earning belt ranks teaches children that great achievements require patience and repeated effort.

## Belt Progression System at ALQIMA

We follow the authentic traditional belt ranking:
1. White Belt – Beginner
2. Yellow Belt – Novice
3. Orange Belt – Junior Intermediate
4. Green Belt – Intermediate
5. Blue Belt – Senior Intermediate
6. Brown Belt – Advanced
7. Black Belt – Master / Expert`,category:"Sports",author:"Coach Tariq Al-Balawi",date:"Dec 25, 2024",readTime:"6 min read",image:"/images/karate.jpg",tags:["Karate","Discipline","Character","Children"]}],Sy=["الكل","صحة وتطوير","نصائح للأهل","أخبار وإنجازات","صحة وتغذية","رياضات"],Ny=["All","Health & Development","Parenting Tips","News & Achievements","Health & Nutrition","Sports"],Nt=({title:r,highlight:c,description:d,centered:u=!0,light:h=!1})=>n.jsxs("div",{className:`mb-12 ${u?"text-center":"text-start"}`,children:[n.jsxs("h2",{className:`text-3xl md:text-5xl font-black mb-4 leading-tight tracking-tight ${h?"text-white":"text-[#18213F]"}`,children:[r,c&&n.jsxs("span",{className:"text-[#D90429]",children:[" ",c]})]}),d&&n.jsx("p",{className:`text-base md:text-lg max-w-2xl leading-relaxed ${u?"mx-auto":""} ${h?"text-white/80":"text-[#5A6E85]"}`,children:d})]}),In=({sportId:r,className:c="",...d})=>{switch(r){case"football":return n.jsx(ly,{className:c,...d});case"basketball":return n.jsx(sy,{className:c,...d});case"swimming":return n.jsx(hy,{className:c,...d});case"karate":return n.jsx(bo,{className:c,...d});case"kickboxing":return n.jsx(oy,{className:c,...d});case"gymnastics":return n.jsx(Rs,{className:c,...d});case"roller-skating":return n.jsx(my,{className:c,...d});default:return n.jsx(Ya,{className:c,...d})}},um=()=>{const{language:r,isRTL:c}=at(),d=At[r],u=r==="en"?"/en":"",h=r==="en"?Ho:Bo,p=r==="en"?jy:by,y=(r==="en"?qo:Lo).slice(0,3),[b,g]=T.useState(!1),m=b?p:p.slice(0,6),N=c?ai:li,w=c?ni:ii,A=[{title:d.features.items[0].title,description:d.features.items[0].desc,icon:Wl},{title:d.features.items[1].title,description:d.features.items[1].desc,icon:$l},{title:d.features.items[2].title,description:d.features.items[2].desc,icon:Fa},{title:d.features.items[3].title,description:d.features.items[3].desc,icon:Cs}],H=r==="en"?[{title:"Foundation & Passion Track",desc:"For children ages 3 to 8 — Building fundamental motor coordination, balance, and agility in a fu هولة عبر تابي (Tabby) وتمارا (Tamara) بدون فوائد أو تعقيدات. تواصل معنا للاطلاع على أحدث العروض.",category:"العروض والباقات"},{id:"f8",question:"هل تقدمون خصومات خاصة للأخوة؟",answer:"نعم، نوفر خصومات عائلية حصرية عند تسجيل الأخوة لدعم العائلات وتشجيع جميع أطفال الأسرة على ممارسة الرياضة في بيئة احترافية موحدة.",category:"العروض والباقات"},{id:"f9",question:"كيف يمكنني الاستفادة من خيار التقسيط عبر تابي أو تمارا؟",answer:"يمكنك اختيار الدفع بالتقسيط عبر تابي أو تمارا عند إتمام الاشتراك، حيث يمكنك تقسيم الرسوم إلى دفعات شهرية ميسرة وفق سياسات مزودي الخدمة المعتمدة.",category:"العروض والباقات"},{id:"f10",question:"ما هي مرافق الأكاديمية المتاحة للأبناء؟",answer:"تضم الأكاديمية ملاعب كرة قدم عشبية حديثة، قاعات كرة سلة مكيفة ومغلقة، مسابح أولمبية وتدريبية متطورة مع نظام تعقيم متقدم، صالات فنون قتالية مجهزة، قاعة جمباز أولمبية، وصالة سكيتنج مجهزة بأحدث أدوات الأمان والسلامة.",category:"المرافق"},{id:"f11",question:"ما هي تدابير الأمن والسلامة المتبعة في الأكاديمية؟",answer:"سلامة أطفالكم هي أولويتنا المطلقة؛ تتوفر تجهيزات إسعاف أولي وطاقم مدرب، نظام مراقبة متكامل، إشراف مستمر على مدار الساعة، وفحص دوري لجميع المعدات والأرضيات لضمان أقصى درجات الأمان.",category:"المرافق"},{id:"f12",question:"هل يُسمح للأهل بحضور الحصص التدريبية ومتابعة أطفالهم؟",answer:"نعم وبكل سرور! نوفر مناطق جلوس مريحة ومكيفة تتيح لأولياء الأمور متابعة تدريبات أبنائهم وتشجيعهم والتواصل المباشر مع الكادر الإداري والفني.",category:"أخرى"},{id:"f13",question:"هل تنظم الأكاديمية معسكرات رياضية في الإجازات المدرسية؟",answer:"نعم، نقدم معسكرات تدريبية وأنشطة رياضية وترفيهية مكثفة وممتعة خلال الإجازات المدرسية والعطلة الصيفية لصقل مهارات الأطفال واستثمار أوقاتهم بإيجابية.",category:"أخرى"},{id:"f14",question:"كيف يمكنني التواصل المباشر مع إدارة الأكاديمية؟",answer:"يمكنكم التواصل الفوري معنا عبر زر الواتساب في الموقع أو الاتصال مباشرة بفريقنا، ويسعدنا دائماً استقبالكم في مقر الأكاديمية بجدة.",category:"أخرى"}],Cy=[{id:"f1",question:"How can I enroll my children in the academy?",answer:"You can easily enroll your children by reaching out to us directly on WhatsApp or calling our customer service team. Our sports advisors will help you select the ideal sport and schedule that best fits your family routine.",category:"Enrollment"},{id:"f2",question:"What documents are required for youth enrollment?",answer:"We only require a copy of the National ID / Iqama for both the child and guardian, alongside any relevant medical notes. All personal information is handled with strict confidentiality.",category:"Enrollment"},{id:"f3",question:"Can my child switch sports after starting?",answer:"Absolutely! We understand that children like exploring different sports to discover their genuine passion. We offer full flexibility to transfer between available sports in coordination with the coaching team.",category:"Enrollment"},{id:"f4",question:"What are the qualifications of the coaching staff?",answer:"All our coaches are officially licensed and certified by recognized sports federations, holding extensive experience in youth athletic mentorship and child safety.",category:"Training"},{id:"f5",question:"What is the coach-to-student ratio in training groups?",answer:"We maintain low coach-to-student ratios in every session to ensure each child receives dedicated personal attention, targeted technical corrections, and continuous encouragement.",category:"Training"},{id:"f6",question:"Do parents receive regular progress reports?",answer:"Yes! We provide comprehensive periodic reports detailing your child’s physical stamina, technical execution, and behavioral growth, complemented by open discussions with the coaches.",category:"Training"},{id:"f7",question:"What offers and payment options are available?",answer:"We provide flexible training packages tailored for families, with convenient installment options available via Tabby and Tamara with zero hassle. Contact us on WhatsApp to learn about current offers.",category:"Offers & Packages"},{id:"f8",question:"Do you provide special discounts for siblings?",answer:"Yes! We provide exclusive family and sibling discounts to support parents in encouraging all their children to stay active in a premier athletic environment.",category:"Offers & Packages"},{id:"f9",question:"How can I utilize installment options with Tabby or Tamara?",answer:"You can select installment payments via Tabby or Tamara upon enrollment confirmation, allowing you to split the fees into manageable monthly installments in accordance with provider terms.",category:"Offers & Packages"},{id:"f10",question:"What facilities are available for children at the academy?",answer:"Our campus features modern natural/synthetic turf football pitches, indoor air-conditioned basketball courts, advanced Olympic-standard swimming pools with advanced sanitization, specialized martial arts dojos, an Olympic gymnastics hall, and a purpose-built safety-padded skating arena.",category:"Facilities"},{id:"f11",question:"What safety and security measures are implemented?",answer:"Your child’s safety is our highest priority. We feature on-site certified first-aid personnel, complete CCTV monitoring, 24/7 facility supervision, and routine safety audits on all floors and apparatus.",category:"Facilities"},{id:"f12",question:"Are parents allowed to attend sessions and watch their children?",answer:"Yes, absolutely! We provide dedicated, air-conditioned spectator seating areas where parents can watch their children train, cheer them on, and interact with the staff.",category:"General"},{id:"f13",question:"Does the academy organize sports camps during school holidays?",answer:"Yes! We host exciting athletic and recreational camps during school breaks and summer holidays to nurture children’s talents and keep them active and engaged in a healthy environment.",category:"General"},{id:"f14",question:"How can I get in touch with the academy administration?",answer:"You can message us instantly via WhatsApp through the website or call our team directly. We are also alw By using our website or enrolling your child in our academy, you consent to the practices described in this policy.`},{title:"Information We Collect",content:`We collect relevant information for operational, administrative, and coaching purposes:

• Student Profile Data: Full name, age, gender, athletic history, and health notes relevant to physical exercise.
• Parent/Guardian Details: Full name, phone number, email address, and emergency contact details.
• Technical & Usage Data: Pages visited, time spent on site, device type, and browser preferences.
• Payment Processing: Handled securely through licensed payment gateways compliant with Saudi Central Bank (SAMA) standards; we do not store credit card numbers directly.

All information is collected with explicit guardian consent solely to provide premium athletic training services.`},{title:"How We Use Your Information",content:`We use collected information for the following purposes:

• Managing athlete enrollment, group assignments, and training schedules.
• Sending critical schedule notifications, event updates, and academy announcements.
• Evaluating and developing training quality and individual performance progress.
• Communicating with parents regarding child development, milestones, and tournament readiness.
• Fulfilling regulatory and legal reporting requirements.

We never sell or distribute your personal data to third parties for commercial advertising without explicit consent.`},{title:"Data Security & Protection",content:`We implement strict organizational and technical security measures:

• End-to-end encrypted transmission via modern HTTPS/TLS protocols.
• Secure server storage protected by industry-grade firewalls and access controls.
• Restricted data access limited strictly to authorized administrative and coaching personnel.
• Routine technical audits and security assessments.
• Retention of personal information only as long as necessary for active operational purposes.`},{title:"Sharing of Information",content:`We do not sell, rent, or lease personal information to third parties except:

• With prior explicit guardian consent.
• When necessary for operational delivery via trusted technical partners bound by confidentiality agreements.
• When required by applicable Saudi laws or official government authorities.
• To protect the safety, rights, and security of academy members and athletes.`},{title:"Your Rights & Privacy Choices",content:`You hold the right at any time to:

• Request access to personal data registered under your account.
• Request correction or updates to any inaccurate information.
• Request data deletion upon completion of program enrollment where no regulatory obligation exists.
• Opt out of non-essential promotional notifications.

To exercise any of these rights, please contact our dedicated privacy officer.`}]:[{title:"مقدمة",content:`تلتزم أكاديمية القمة الرياضية بحماية خصوصية مستخدمي موقعها الإلكتروني وحماية البيانات الشخصية لجميع المسجلين والمتواصلين معها. تُوضّح سياسة الخصوصية هذه كيفية جمع المعلومات واستخدامها والحفاظ عليها والإفصاح عنها.

بالتسجيل في الأكاديمية أو استخدام موقعنا الإلكتروني، فإنك توافق على الشروط الواردة في هذه السياسة.`},{title:"المعلومات التي نجمعها",content:`نجمع المعلومات التالية لأغراض تشغيلية وإدارية وفنية:

• البيانات الشخصية: الاسم، العمر، الجنس، التاريخ الرياضي، الحالة الصحية ذات الصلة بالنشاط الرياضي
• بيانات ولي الأمر: الاسم، رقم الهاتف، البريد الإلكتروني، صلة القرابة
• بيانات الاستخدام: الصفحات المُزارة، مدة البقاء، الأجهزة المستخدمة
• بيانات الدفع: تتم معالجتها عبر منصات آمنة ومُعتمدة من البنك المركزي دون الاحتفاظ بأرقام البطاقات المصرفية

جميع البيانات تُجمع بموافقة صريحة ولأغراض تقديم الخدمة الرياضية والتدريبية فقط.`},{title:"كيفية استخدام المعلومات",content:`نستخدم المعلومات التي نجمعها للأغراض التالية:

• إدارة تسجيل الطلاب وتنظيم الجلسات التدريبية وتوزيع الفئات
• إرسال التحديثات والإشعارات المتعلقة بالبرامج والجداول والمواعيد
• تطوير جودة خدماتنا وبرامجنا التدريبية ومتابعة الأداء الرياضي
• الوفاء بالالتزامات القانونية والتنظيمية
• التواصل مع أولياء الأمور حول تقدم أطفالهم وجاهزيتهم للمنافسات

لا نستخدم بياناتك لأغراض تجارية أو إعلانية موجهة لطرف ثالث دون موافقتك الصريحة.`},{title:"حماية وأمان المعلومات",content:`نتخذ تدابير أمنية شاملة لحماية بياناتك:

• تشفير جميع البيانات المنقولة عبر بروتوكول HTTPS المشفر
• تخزين البيانات على خوادم آمنة مع تطبيق أنظمة الحماية المتطورة
• حصر صلاحيات الوصول إلى البيانات للموظفين والمشرفين المُصرّح لهم فقط
• إجراء مراجعات أمنية وفنية دورية
• عدم الاحتفاظ بالبيانات لمدة أطول مما هو ضروري للأغراض التشغيلية`},{title:"مشاركة المعلومات",content:`لا نبيع أو نؤجر أو نشارك معلوماتك الشخصية مع أطراف ثالثة إلا في الحالات التالية:

• بموافقتك الصريحة المسبقة
• عند الضرورة الفنية لتشغيل المنصة عبر شركاء تقنيين موثوقين ومقيدين باتفاقيات سرية
• عند الالتزام بمتطلبات قانونية أو تنظيمية رسمية
• لحماية حقوق وسلامة أعضاء ومنتسبي الأكاديمية`},{title:"حقوق المستخدم",content:`يحق لك في أي وقت:

• طلب الاطلاع على بياناتك الشخصية المسجلة لدينا
• طلب تصحيح أو تحديث أي بيانات غير دقيقة
• طلب حذف بياناتك عند انتهاء الاشتراك وعدم وجود التزام تنظيمي
• سحب الموافقة على تلقي الرسائل التوعوية أو غير الضرورية

لممارسة أي من هذه الحقوق، يُرجى التواصل معنا عبر البريد الإلكتروني المخصص للخصوصية.`}];return n.jsxs("div",{children:[n.jsx(ga,{title:c.footer.privacy,subtitle:r==="en"?"Our commitment to protecting your privacy and your child’s data at ALQIMA Sports Academy":"التزامنا بحماية بياناتك وخصوصيتك في أكاديمية القمة الرياضية",breadcrumbs:[{label:c.footer.privacy}],badge:r==="en"?"Privacy & Security":"الخصوصية والأمان"}),n.jsx("section",{className:"section-padding bg-white",children:n.jsx("div",{className:"container mx-auto px-4 md:px-8",children:n.jsxs("div",{className:"max-w-4xl mx-auto",children:[n.jsx(Y,{direction:"up",children:n.jsxs("div",{className:"bg-[#F2F3F5] rounded-2xl p-5 mb-10 flex items-center gap-3.5 border border-gray-100",children:[n.jsx("div",{className:"w-10 h-10 rounded-xl bg-[#D90429] flex items-center justify-center flex-shrink-0 text-white shadow-sm",children:n.jsx(Wl,{size:22})}),n.jsxs("div",{children:[n.jsx("div",{className:"font-bold text-[#18213F] tabular-nums",children:r==="en"?"Last Updated: January 1, 2025":"آخر تحديث: ١ يناير ٢٠٢٥"}),n.jsx("div",{className:"text-[#5A6E85] text-sm font-medium",children:r==="en"?"Please read this policy carefully to understand how your family data is handled":"يُرجى قراءة هذه السياسة بعناية للتعرف على حقوقك وضوابط استخدام البيانات"})]})]})}),n.jsx(Y,{direction:"up",delay:80,children:n.jsxs("div",{className:"bg-[#18213F] rounded-3xl p-7 mb-10 text-white shadow-lg",children:[n.jsx("h3",{className:"font-black text-lg mb-4",children:r==="en"?"Table of Contents":"فهرس المحتوى"}),n.jsx("ul",{className:"grid grid-cols-1 md:grid-cols-2 gap-2.5",children:d.map((u,h)=>n.jsx("li",{children:n.jsxs("a",{href:`#section-${h}`,className:"flex items-center gap-2.5 text-white/80 hover:text-white text-sm transition-colors tabular-nums",children:[n.jsx("span",{className:"w-6 h-6 rounded-lg bg-white/10 flex items-center justify-center text-xs font-bold",children:h+1}),n.jsx("span",{children:u.title})]})},u.title))})]})}),n.jsx("d :r,isRTL:c}=at(),d=At[r],u=r==="en"?"/en":"",h=r==="en"?[{title:"General Terms & Conditions",content:`Welcome to ALQIMA Sports Academy. These Terms and Conditions govern your use of our website and enrollment in our youth athletic programs.

By accessing this website or enrolling in any academy program, you accept these terms in full. Please do not continue using our services if you do not agree to all terms stated on this page.`},{title:"Enrollment & Participation",content:`• Enrollment is open to specified youth age groups according to academy criteria.
• Accurate, true, and complete information must be provided during the registration process.
• Parents or legal guardians retain the right to enroll dependents under 18 years of age.
• The academy reserves the right to decline or cancel any enrollment if submitted information is inaccurate.
• Participation becomes active upon payment confirmation and administrative coordinator verification.`},{title:"Fees & Refund Policy",content:`• All program fees are stated in Saudi Riyals (SAR) and inclusive of applicable Value Added Tax (VAT).
• Training fees are non-refundable once the training cycle has begun, except under exceptional administrative circumstances approved by management.
• Program participation may be frozen once during the enrollment period subject to academy regulations.
• The academy reserves the right to adjust program fees and offers with prior notice provided to members before renewal.`},{title:"Safety & Behavioral Standards",content:`• All participants and guardians must adhere to safety directives issued by certified coaching and management staff.
• Proper athletic attire and mandatory protective equipment for each sport must be worn at all times.
• The academy assumes no liability for lost personal belongings within the sports facility.
• The academy reserves the right to suspend or terminate the enrollment of any participant engaging in serious behavioral misconduct.
• Full disclosure of any medical conditions or pre-existing injuries affecting child safety must be provided prior to participation.`},{title:"Intellectual Property & Media",content:`• All content, logos, and materials on this website are the property of ALQIMA Sports Academy.
• The academy may capture photographs or video footage during sessions and events for documentation and promotional purposes, unless a parent provides written notice otherwise.
• No part of published academy materials may be reproduced or distributed without prior written consent.`},{title:"Amendments to Terms",content:`ALQIMA Sports Academy reserves the right to update or modify these Terms & Conditions at any time. Updates take effect immediately upon publication on the website.

Continued use of our website and services following updates constitutes explicit acceptance of the revised terms.`}]:[{title:"شروط وأحكام عامة",content:`مرحبًا بكم في أكاديمية القمة الرياضية. تحدد هذه الشروط والأحكام القواعد واللوائح الخاصة باستخدام موقعنا الإلكتروني والتسجيل في برامجنا الرياضية.

باستخدام هذا الموقع أو التسجيل في أي من برامج الأكاديمية، فإنك تقبل هذه الشروط بالكامل. لا تستمر في استخدام خدماتنا إذا كنت لا توافق على جميع الشروط والأحكام المذكورة في هذه الصفحة.`},{title:"شروط التسجيل والعضوية",content:`• التسجيل متاح للأعمار المحددة لكل برنامج رياضي وفق شروط الأكاديمية
• يجب تقديم معلومات صحيحة ودقيقة وكاملة أثناء عملية التسجيل
• يحتفظ ولي الأمر بالحق في تسجيل التابعين له ممن هم دون سن ١٨ عامًا
• يحق للأكاديمية رفض أو إلغاء أي تسجيل إذا تبيّن عدم صحة البيانات المقدمة
• يعتبر الاشتراك ساري المفعول فور سداد الرسوم المقررة وتأكيد المشرف الإداري`},{title:"الرسوم وسياسة الاسترداد",content:`• جميع الرسوم موضحة بالريال السعودي وتشمل ضريبة القيمة المضافة المقررة
